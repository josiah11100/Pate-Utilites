services:
  - type: worker
    name: pate-utilities
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python pate_utilities.py
    disk:
      name: pate-utilities-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PATE_DB_PATH
        value: /var/data/pate_utilities.sqlite3
